# yaml-language-server: $schema=../device.schema.json

schema: 1

id: t817l
name: Wired Cam C31
models:
  - T817L
  - T817L121
device_type: 10031

capabilities:
  controls:
    motion_detection:
      connections:
        T8030:
          status: tested
          tested_on: 2026-09-21
          tested_by: mscodemonkey
      read:
        parameter: 1011
      write:
        command: 1011
      values:
        0: "Off"
        1: "On"

    night_vision:
      connections:
        T8030:
          status: tested
          tested_on: 2026-09-21
          tested_by: mscodemonkey
      read:
        parameter: 1277
      write:
        command: 1277
      values:
        0: "PureColor"
        1: "Infrared"
        2: "Spotlight"

    siren:
      connections:
        T8030:
          status: tested
          tested_on: 2026-09-21
          tested_by: mscodemonkey
      requires_parameter: 1015
      write:
        command: 1202
        input:
          name: duration_seconds
          type: integer
          minimum: 0
          maximum: 900
      notes: A duration of 0 stops the siren.

  media:
    live_view:
      connections:
        T8030:
          status: tested
          tested_on: 2026-09-21
          tested_by: mscodemonkey
        direct:
          status: declared
    snapshot:
      connections:
        T8030:
          status: tested
          tested_on: 2026-09-21
          tested_by: mscodemonkey
        direct:
          status: declared

ignored:
  battery:
    fields:
      - battery.level
      - battery.charging
      - battery.health
      - battery.temperature
    reason: Mains-powered device reports compatibility placeholder values.
