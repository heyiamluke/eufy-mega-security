# yaml-language-server: $schema=../device.schema.json

schema: 1
id: t8n00
name: NVR S4 Max
category: nvr
integration:
  status: recognised
aliases:
  - NVR S4
  - S4 8-Channel NVR
models:
  - T8N00
  - T8N00141
device_type: 300
capabilities:
  readable:
    current_mode:
      connections:
        direct:
          status: declared
      read:
        parameter: 1151
      values:
        "0": "Away"
        "1": "Home"
        "3": "Custom 1"
        "4": "Custom 2"
        "5": "Custom 3"
        "6": "Off"
        "63": "Disarmed"
    alarm_active:
      connections:
        direct:
          status: declared
      read:
        field: alarm
    storage_status:
      connections:
        direct:
          status: declared
      read:
        parameter: 1135
  controls:
    guard_mode:
      connections:
        direct:
          status: declared
      read:
        parameter: 1224
      write:
        command: 1224
      values:
        "0": "Away"
        "1": "Home"
        "2": "Schedule"
        "3": "Custom 1"
        "4": "Custom 2"
        "5": "Custom 3"
        "6": "Off"
        "47": "Geofencing"
        "63": "Disarmed"
      notes: The Off value is reported only when a keypad is attached.
    time_format:
      connections:
        direct:
          status: declared
      read:
        parameter: 1253
      write:
        command: 1253
      values:
        "0": "12 hour"
        "1": "24 hour"
    alarm_tone:
      connections:
        direct:
          status: declared
      read:
        parameter: 1281
      write:
        command: 1281
      values:
        "1": "Alarm sound 1"
        "2": "Alarm sound 2"
