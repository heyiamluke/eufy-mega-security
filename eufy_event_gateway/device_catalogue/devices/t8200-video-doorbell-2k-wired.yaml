      connections:
        direct:
          status: declared
    snapshot:
      connections:
        direct:
          status: declared
  events:
    motion:
      connections:
        direct:
          status: declared
    person:
      connections:
        direct:
          status: declared
    doorbell_press:
      connections:
        direct:
          status: declared
