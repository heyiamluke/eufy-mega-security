name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eufy_event_gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: eufy_event_gateway/package-lock.json
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm ci
      - run: npm run check
      - run: npm run build

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
